    annotationProcessor 'com.github.moxy-community:moxy-compiler:1.0.13'
    implementation 'com.github.moxy-community:moxy-androidx:1.0.13'

    //Preferences
    implementation "androidx.preference:preference:1.1.1"

    // Masked edittext
//    implementation 'com.vicmikhailau:MaskedEditText:3.0.4'

    // qr code reading
    implementation('com.journeyapps:zxing-android-embedded:4.1.0') { transitive = false }

    implementation ('com.google.zxing:core:3.3.3') {
        because("DO NOT UPGRADE TO HIGHER THAN 3.3.3 !! cunki daha yuxari verisalarin ancaq Android API 24+ olanda isleyir. SurfaceView ve s sohbetine gore")
    }

    // Carousel view
//    implementation 'com.azoft.carousellayoutmanager:carousel:1.2.4'

    // Card scanner
    implementation 'io.card:android-sdk:5.5.1'

    // Chromium browser
    implementation "androidx.browser:browser:1.3.0"

    // Lingver lib
    implementation "com.github.YarikSOffice:lingver:1.3.0"

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
