name: btb_mobile_flutter
description: "BTB Mobile Banking Flutter Application"
publish_to: 'none'

version: 1.0.8+411

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Navigation
  go_router: ^12.1.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.9
  firebase_performance: ^0.9.3+7
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Biometrics
  local_auth: ^2.1.7
  
  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  intl: ^0.20.2
  flutter_screenutil: ^5.9.0
  
  # Utils
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.2
  webview_flutter: ^4.4.2
  crypto: ^3.0.3
  
  # UI Components
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/sf_pro_regular.ttf
        - asset: assets/fonts/sf_pro_semibold.ttf
          weight: 600
        - asset: assets/fonts/sf_pro_bold.ttf
          weight: 700
